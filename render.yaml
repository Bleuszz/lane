# Free staging only. Durable external PostgreSQL is required; no Render trial database.
services:
  - type: web
    name: lane-staging
    rootDir: .
    runtime: node
    plan: free
    region: frankfurt
    branch: codex/lane-smart-crosslisting
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    buildCommand: npm ci && npm run build:node
    startCommand: node scripts/start-server.mjs
    envVars:
      - key: LANE_ENV
        value: staging
      - key: PUBLIC_INDEXING
        value: "false"
      - key: LOG_LEVEL
        value: "warn"
      - key: NODE_VERSION
        value: 24.14.0
      - key: VITE_AUTH_ENABLED
        value: "true"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: LANE_BILLING_V2_READY
        value: "false"
      - key: LANE_EBAY_ORDER_POLLING
        value: "false"
      - key: LANE_ALLOW_PREVIEW_PLANS
        value: "false"
      - key: LANE_SUPPORT_ENABLED
        value: "false"
      - key: LANE_ANALYTICS_ENABLED
        value: "false"
      - key: VITE_LANE_ANALYTICS_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: "mock"
      - key: AI_LISTING_ENABLED
        value: "false"
      - key: AI_IMAGE_ENABLED
        value: "false"
      - key: AI_MOCK_DEVELOPMENT
        value: "false"
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: BULK_AUTOMATION_ENABLED
        value: "false"
      - key: IMAGE_NORMALIZATION_ENABLED
        value: "false"
