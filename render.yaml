# Prepared only. No service has been created; deploy after real session/read proof.
services:
  - type: web
    name: lane-staging
    runtime: node
    plan: free
    region: frankfurt
    branch: codex/lane-smart-crosslisting
    autoDeploy: false
    buildCommand: npm ci && npm run build:node
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: VITE_AUTH_ENABLED
        value: "true"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: LANE_BILLING_V2_READY
        value: "false"
      - key: LANE_EBAY_ORDER_POLLING
        value: "false"
      - key: LANE_ALLOW_PREVIEW_PLANS
        value: "false"
